<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Meesho</title>
  <link rel="stylesheet" href="styles/login.css" />
</head>

<body>
  <div class="login-container">
    <!-- Logo -->
    <img src="assets/logo.jpg" alt="Meesho Logo" id="meesho_logo_login_page" />
    <h2>Log in to view your profile</h2>
    <form id="login-form">
      <div id="input-group">
        <label for="phone">Enter Your Mobile No. </label>
        <input type="tel" id="phone" placeholder="Enter Your Mobile No." />
        <label for="pass">Enter Your Password </label>
        <input type="password" id="pass" placeholder="Enter Your Password" />
        <div>
          <button id="logSub" class="Submit"><a href="signup.html">Submit</a></button>
        </div>
      </div>

      <div class="signup-btn">
        <label for="signup_button">Don't Have an Account?</label>
        <div>
          <button>Sign Up</button>
        </div>
      </div>
      <p class="terms">
        Terms And Conditions Apply,
        <a href="terms_and_conditions.html" target="_blank">Click Here</a>
      </p>
      <div></div>
    </form>
  </div>
  <script src="script.js"></script>
</body>

</html>
